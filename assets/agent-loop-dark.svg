<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="190" viewBox="0 0 1120 190" role="img"><title>Agent loop — a decorative pixel agent moves from task to reasoning, tools and output; not a contribution chart</title>
<style>text{font-family:Consolas,"Liberation Mono",Menlo,monospace;white-space:pre}.blink{animation:blink 1.2s step-end infinite}.scan{animation:scan 12s linear infinite}.runner{animation:run 12s linear infinite}.pulse{animation:pulse 12s ease-in-out infinite}.arrow{animation:nudge 3s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes scan{0%,8%{transform:translateY(-470px);opacity:0}10%{opacity:.8}42%{transform:translateY(470px);opacity:.8}44%,100%{transform:translateY(470px);opacity:0}}@keyframes run{0%,10%{transform:translateX(0)}30%,35%{transform:translateX(300px)}55%,60%{transform:translateX(600px)}80%,95%{transform:translateX(900px)}100%{transform:translateX(0)}}@keyframes pulse{0%,20%,100%{opacity:.25}30%,60%{opacity:1}80%{opacity:.25}}@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){.blink,.scan,.runner,.pulse,.arrow{animation:none}.scan{display:none}}</style>
<text x="20" y="26" fill="#79e2ba" font-size="17" >$ agent.run()</text>
<text x="1090" y="26" fill="#8594a6" font-size="14" text-anchor="end">TASK / REASON / ACT / RETURN</text>
<path d="M100 99H1000" fill="none" stroke="#263b38" stroke-width="2" stroke-dasharray="3 9"/>
<circle cx="100" cy="99" r="4" fill="#79e2ba"/>
<text x="100" y="143" fill="#e6edf3" font-size="17" text-anchor="middle">TASK</text>
<text x="100" y="165" fill="#8594a6" font-size="14" text-anchor="middle">understand</text>
<circle cx="400" cy="99" r="4" fill="#79e2ba"/>
<text x="400" y="143" fill="#e6edf3" font-size="17" text-anchor="middle">REASON</text>
<text x="400" y="165" fill="#8594a6" font-size="14" text-anchor="middle">plan</text>
<circle cx="700" cy="99" r="4" fill="#79e2ba"/>
<text x="700" y="143" fill="#e6edf3" font-size="17" text-anchor="middle">TOOLS</text>
<text x="700" y="165" fill="#8594a6" font-size="14" text-anchor="middle">execute</text>
<circle cx="1000" cy="99" r="4" fill="#79e2ba"/>
<text x="1000" y="143" fill="#e6edf3" font-size="17" text-anchor="middle">OUTPUT</text>
<text x="1000" y="165" fill="#8594a6" font-size="14" text-anchor="middle">iterate</text>
<g class="runner" fill="#79e2ba" shape-rendering="crispEdges"><path d="M94 73h3v3h-3zM97 73h3v3h-3zM100 73h3v3h-3zM103 73h3v3h-3zM106 73h3v3h-3zM91 76h3v3h-3zM94 76h3v3h-3zM97 76h3v3h-3zM100 76h3v3h-3zM103 76h3v3h-3zM106 76h3v3h-3zM109 76h3v3h-3zM88 79h3v3h-3zM91 79h3v3h-3zM97 79h3v3h-3zM100 79h3v3h-3zM103 79h3v3h-3zM109 79h3v3h-3zM112 79h3v3h-3zM88 82h3v3h-3zM91 82h3v3h-3zM94 82h3v3h-3zM97 82h3v3h-3zM100 82h3v3h-3zM103 82h3v3h-3zM106 82h3v3h-3zM109 82h3v3h-3zM112 82h3v3h-3zM91 85h3v3h-3zM94 85h3v3h-3zM97 85h3v3h-3zM100 85h3v3h-3zM103 85h3v3h-3zM106 85h3v3h-3zM109 85h3v3h-3zM94 88h3v3h-3zM106 88h3v3h-3zM91 91h3v3h-3zM94 91h3v3h-3zM106 91h3v3h-3zM109 91h3v3h-3z"/><g class="blink"><rect x="94" y="79" width="3" height="3"/><rect x="106" y="79" width="3" height="3"/></g></g>
</svg>
