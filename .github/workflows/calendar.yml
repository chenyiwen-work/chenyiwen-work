name: Refresh contribution calendar
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch contributions and render animations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_calendar.py
          python scripts/build_pacman.py
      - name: Commit refreshed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/calendar.json assets/pacman-dark.svg assets/pacman-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution calendar'
            git push
          fi
